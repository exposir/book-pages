                                <div className="w-24 font-bold text-stone-400 text-sm">任务发布</div>
                                <div className="flex-1 text-stone-800">前往“红色麦加”，学习革命理论，拯救中国。</div>
                            </div>
                            <div className="flex">
                                <div className="w-24 font-bold text-stone-400 text-sm">执行阻碍</div>
                                <div className="flex-1 text-stone-800">语言障碍、严酷的物质生活、国共分裂的政治冲击、斯大林式清党的恐怖。</div>
                            </div>
                            <div className="flex">
                                <div className="w-24 font-bold text-stone-400 text-sm">最终解决</div>
                                <div className="flex-1 text-stone-800">要么随波逐流加入王明宗派，要么坚守良知被迫害，要么逃离。</div>
                            </div>
                            <div className="flex">
                                <div className="w-24 font-bold text-stone-400 text-sm">获得奖励</div>
                                <div className="flex-1 text-stone-800">对于幸存者而言，奖励是“真相”与“惨痛的教训”；对于掌权者，是暂时的权力。</div>
                            </div>
                         </div>
                    </div>
                </section>
            </div>
        );

        const CharacterCard = ({ char }) => {
            const [isFlipped, setIsFlipped] = useState(false);

            return (
                <div 
                    className={`card-flip h-96 w-full cursor-pointer ${isFlipped ? 'flipped' : ''}`}
                    onClick={() => setIsFlipped(!isFlipped)}
                >
                    <div className="card-inner shadow-xl">
                        {/* Front */}
                        <div className={`card-front ${char.color} border-4 border-stone-100 shadow-inner`}>
                            <h3 className="text-2xl font-black mb-2">{char.name}</h3>
                            <div className="w-16 h-1 bg-current opacity-50 mb-4"></div>
                            <p className="font-bold text-sm uppercase tracking-widest opacity-80 mb-6">{char.role}</p>
                            <div className="text-left w-full px-4 space-y-3">
                                <p className="text-xs font-bold opacity-70">核心欲望 (WANT)</p>
                                <p className="text-sm leading-tight">{char.want}</p>
                                <p className="text-xs font-bold opacity-70 mt-2">人物原型</p>
                                <p className="text-sm">{char.archetype}</p>
                            </div>
                            <div className="absolute bottom-4 text-xs opacity-50 flex items-center">
                                点击查看深层侧写 <ChevronRight size={12} />
                            </div>
                        </div>

                        {/* Back */}
                        <div className="card-back bg-stone-900 text-stone-200 border-4 border-soviet-red">
                            <h3 className="text-xl font-bold text-soviet-red mb-4">心理侧写 & 结局</h3>
                            <div className="space-y-4 px-2">
                                <div>
                                    <span className="text-xs text-stone-500 uppercase block">内在恐惧</span>
                                    <p className="text-sm">{char.fear}</p>
                                </div>
                                <div>
                                    <span className="text-xs text-stone-500 uppercase block">人物弧光</span>
                                    <p className="text-sm">{char.arc}</p>
                                </div>
                                <div className="pt-2 border-t border-stone-800">
                                    <p className="text-xs italic opacity-70">"{char.backContent}"</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const Characters = () => (
            <div className="p-8 md:p-16 max-w-7xl mx-auto">
                <h2 className="text-3xl font-bold mb-10 text-stone-800 border-b-2 border-stone-300 pb-4">人物档案 <span className="text-lg font-normal text-stone-500">点击卡片解密</span></h2>
                <div className="grid md:grid-cols-2 lg:grid-cols-4 gap-8">
                    {CHARACTERS.map((char, idx) => (
                        <CharacterCard key={idx} char={char} />
                    ))}
                </div>
            </div>
        );

        const Timeline = () => (
            <div className="p-8 md:p-16 max-w-5xl mx-auto">
                <h2 className="text-3xl font-bold mb-12 text-stone-800">莫斯科时间线 <span className="text-sm font-normal text-soviet-red ml-2">1925 - 1930</span></h2>
                <div className="relative border-l-4 border-stone-300 ml-4 md:ml-0 space-y-12">
                    {TIMELINE.map((item, idx) => (
                        <div key={idx} className="relative pl-8 md:pl-12 group">
                            {/* Dot */}
                            <div className="absolute -left-[10px] top-2 w-4 h-4 rounded-full bg-stone-400 border-2 border-white group-hover:bg-soviet-red group-hover:scale-125 transition-all"></div>
                            
                            {/* Content */}
                            <div className="bg-white p-6 rounded-sm shadow-md border-l-4 border-transparent hover:border-soviet-red transition-all duration-300">
                                <div className="flex flex-col md:flex-row md:items-center justify-between mb-2">
                                    <span className="font-mono text-soviet-red font-bold text-xl">{item.year}</span>
                                    <h3 className="text-lg font-bold text-stone-900">{item.event}</h3>
                                </div>
                                <p className="text-stone-600 mb-4 leading-relaxed">{item.desc}</p>
                                <div className="bg-stone-50 p-3 text-sm text-stone-500 border border-stone-100 flex items-start">
                                    <Brain size={16} className="mr-2 mt-1 flex-shrink-0 text-stone-400" />
                                    <span><strong>因果链：</strong>{item.impact}</span>
                                </div>
                            </div>
                        </div>
                    ))}
                </div>
            </div>
        );

        const Plot = () => (
            <div className="p-8 md:p-16 max-w-4xl mx-auto">
                <h2 className="text-3xl font-bold mb-12 text-stone-800">深度剧情解析</h2>
                <div className="space-y-16">
                    {PLOT_BEATS.map((beat, idx) => (
                        <div key={idx} className="relative">
                            <div className="absolute -left-4 -top-4 text-6xl font-black text-stone-200 z-0 select-none">0{idx + 1}</div>
                            <div className="relative z-10 bg-white/90 p-8 border border-stone-200 shadow-lg backdrop-blur-sm">
                                <div className="flex items-center justify-between mb-4">
                                    <h3 className="text-2xl font-bold text-soviet-red">{beat.title}</h3>
                                    <span className="text-xs uppercase font-bold tracking-widest text-stone-400 border border-stone-200 px-2 py-1 rounded">{beat.type}</span>
                                </div>
                                <p className="text-stone-700 leading-loose text-lg mb-6 font-serif">
                                    {beat.content}
                                </p>
                                <div className="flex items-start bg-amber-50 p-4 border-l-4 border-amber-500 text-amber-900 text-sm">
                                    <Target size={18} className="mr-2 mt-0.5 flex-shrink-0" />
                                    <div>
                                        <strong>伏笔与揭晓：</strong> {beat.reveal}
                                    </div>
                                </div>
                            </div>
                        </div>
                    ))}
                </div>
            </div>
        );

        const MermaidChart = ({ chartDefinition }) => {
            const ref = useRef(null);

            useEffect(() => {
                if (ref.current) {
                    try {
                        mermaid.contentLoaded();
                    } catch (e) {
                        console.error("Mermaid render error", e);
                    }
                }
            }, [chartDefinition]);

            return (
                <div className="mermaid bg-white p-6 rounded shadow overflow-x-auto flex justify-center">
                    {chartDefinition}
                </div>
            );
        };

        const Analysis = () => {
            useEffect(() => {
                mermaid.initialize({ startOnLoad: true, theme: 'neutral', securityLevel: 'loose' });
                mermaid.contentLoaded();
            }, []);

            const graphData = `
            graph TD
                subgraph Soviet[苏联高层]
                    Stalin[斯大林] --清算--> Trotsky[托洛茨基]
                    Stalin --控制--> Comintern[共产国际]
                end

                subgraph UTK[莫斯科中山大学管理层]
                    Comintern --任命--> Radek[第一任：拉狄克]
                    Comintern --扶持--> Mif[第三任：米夫]
                    Radek --被清洗--> Mif
                end

                subgraph Students[学生派系]
                    Mif --提拔--> 28B[二十八个布尔什维克<br/>(王明/博古等)]
                    Students_Gen[普通学生] --质疑--> 28B
                    28B --打压/举报--> Anti[反校派/被指托派<br/>(盛岳等)]
                end

                subgraph Impact[中国革命后果]
                    28B --回国夺权--> CCP_Center[中共中央]
                    CCP_Center --左倾教条--> 5th_Fail[第五次反围剿失败]
                end

                style Stalin fill:#7f1d1d,color:#fff
                style 28B fill:#b91c1c,color:#fff
                style Anti fill:#57534e,color:#fff
            `;

            const flowData = `
            flowchart LR
                A[入学: 理想主义] --> B{1927年分水岭}
                B -- 紧跟斯大林路线 --> C[加入王明宗派]
                B -- 独立思考/质疑 --> D[被打成托派/反校派]
                C --> E[平步青云/回国掌权]
                D --> F[格别乌审查]
                F --> G[流放/监禁/处决]
                F --> H[侥幸回国/脱党]
            `;

            return (
                <div className="p-8 md:p-16 max-w-6xl mx-auto space-y-12">
                    <div>
                        <h2 className="text-3xl font-bold mb-6 text-stone-800">权力结构图</h2>
                        <p className="mb-4 text-stone-600">展示了苏联高层政治斗争如何逐级传导至中山大学内部，形成致命的派系对立。</p>
                        <MermaidChart chartDefinition={graphData} />
                    </div>
                    
                    <div className="border-t border-stone-300 pt-12">
                        <h2 className="text-3xl font-bold mb-6 text-stone-800">命运流程图</h2>
                        <p className="mb-4 text-stone-600">一名中山大学学生的生存路径推演。</p>
                        <MermaidChart chartDefinition={flowData} />
                    </div>
                </div>
            );
        };

        const App = () => {
            const [activeTab, setActiveTab] = useState('overview');

            const renderContent = () => {
                switch(activeTab) {
                    case 'overview': return <Overview />;
                    case 'characters': return <Characters />;
                    case 'timeline': return <Timeline />;
                    case 'plot': return <Plot />;
                    case 'analysis': return <Analysis />;
                    default: return <Overview />;
                }
            };

            return (
                <div className="flex flex-col md:flex-row min-h-screen">
                    <Navigation activeTab={activeTab} setActiveTab={setActiveTab} />
                    <main className="flex-1 overflow-x-hidden bg-stone-100">
                        {renderContent()}
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
